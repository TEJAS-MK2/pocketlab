name: Feature request
description: Suggest an improvement or learning scenario for PacketLab.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the feature
    validations:
      required: true
  - type: dropdown
    id: offline
    attributes:
      label: Can this work locally/offline?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: Explain how the proposal preserves local-first behavior and avoids unintended real-network activity.
    validations:
      required: false
