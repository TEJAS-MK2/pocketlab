name: Generate npm lockfile artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: commit npm package lockfile"
            git push origin HEAD:main
          else
            echo "package-lock.json is already current."
          fi
      - name: Upload lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: packetlab-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
